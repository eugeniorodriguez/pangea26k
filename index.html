<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pangea 6 - Entrenamiento gamificado para el 23 de mayo de 2026</title>
    <meta
      name="description"
      content="Entrenador interactivo de Pangea 6 de Primaria con teoria base, soluciones paso a paso, XP, rachas y reto diario."
    />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
            <circle cx="16" cy="16" r="14" fill="currentColor" opacity="0.15" />
            <path
              d="M10 22 L16 6 L22 22 Z"
              fill="currentColor"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linejoin="round"
            />
          </svg>
        </span>
        <div>
          <strong>Pangea 6</strong>
          <span>Cadete en entrenamiento</span>
        </div>
      </div>
      <nav class="view-tabs" aria-label="Vistas">
        <button class="tab is-active" data-view="train" type="button">Entrenar</button>
        <button class="tab" data-view="daily" type="button">Reto del dia</button>
        <button class="tab" data-view="categories" type="button">Categorias</button>
        <button class="tab" data-view="profile" type="button">Perfil</button>
        <button class="tab" data-view="sources" type="button">Pruebas</button>
      </nav>
      <div class="countdown" aria-label="Cuenta atras">
        <span id="daysLeft">--</span>
        <small>dias para el 23/05/2026</small>
      </div>
    </header>

    <main class="app-shell">
      <aside class="filters" aria-label="Filtros">
        <div class="filter-head">
          <span>Avance global</span>
          <strong id="progressText">0 / 0</strong>
        </div>
        <div class="progress-track" aria-hidden="true">
          <span id="progressBar"></span>
        </div>

        <label class="field">
          <span>Buscar</span>
          <input id="searchInput" type="search" placeholder="por tema, ano o enunciado" />
        </label>

        <label class="field">
          <span>Ano</span>
          <select id="yearFilter"></select>
        </label>

        <label class="field">
          <span>Ronda</span>
          <select id="roundFilter"></select>
        </label>

        <label class="field">
          <span>Dificultad</span>
          <select id="difficultyFilter">
            <option value="">Todas</option>
            <option value="facil">Facil</option>
            <option value="medio">Media</option>
            <option value="reto">Reto</option>
          </select>
        </label>

        <div class="check-row">
          <label><input id="visualFilter" type="checkbox" /> Con figura</label>
          <label><input id="pendingFilter" type="checkbox" /> Pendientes</label>
        </div>

        <div class="category-list" id="categoryFilter"></div>

        <div class="mascot" aria-hidden="true">
          <div class="mascot-bubble">
            <p>Cada acierto = XP. Tres aciertos seguidos = combo de fuego.</p>
          </div>
          <div class="mascot-avatar">
            <svg viewBox="0 0 80 80" width="60" height="60">
              <circle cx="40" cy="40" r="32" fill="#fef3c7" stroke="#f59e0b" stroke-width="3" />
              <circle cx="30" cy="36" r="3.5" fill="#1f2937" />
              <circle cx="50" cy="36" r="3.5" fill="#1f2937" />
              <path d="M28 50 Q40 60 52 50" stroke="#1f2937" stroke-width="3" stroke-linecap="round" fill="none" />
              <path d="M22 22 L30 18" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
              <path d="M58 22 L50 18" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
            </svg>
          </div>
        </div>
      </aside>

      <section class="workspace">
        <section class="status-band" id="statusBand"></section>

        <section id="viewTrain" class="view is-visible"></section>
        <section id="viewDaily" class="view"></section>
        <section id="viewCategories" class="view"></section>
        <section id="viewProfile" class="view"></section>
        <section id="viewSources" class="view"></section>
      </section>
    </main>

    <script src="data/exercises.js"></script>
    <script src="data/solutions.js"></script>
    <script src="data/overrides.js"></script>
    <script src="app.js"></script>
  </body>
</html>
